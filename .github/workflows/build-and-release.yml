name: Build, audit and release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run tests
        run: xcrun swift test

      - name: Build hardened ad-hoc app
        run: ./build-app.sh dist

      - name: Package and audit
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "发布标签 $GITHUB_REF_NAME 与应用版本 v${VERSION} 不一致" >&2
            exit 1
          fi
          ARCHIVE="CodexQuotaMenu-v${VERSION}-macOS-${{ matrix.architecture }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Codex用量.app" "$ARCHIVE"
          ./scripts/audit-release.sh "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload audited artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.architecture }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Require and verify both Mac architectures
        run: ./scripts/verify-release-assets.sh release-assets "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release-assets/*
          --verify-tag
          --generate-notes
          --title "Codex 用量 $GITHUB_REF_NAME"
          --notes "同时提供 Apple Silicon（arm64）和 Intel（x86_64）安装包。两套安装包均经过测试、发布审计和 SHA-256 校验。本版本采用 Hardened Runtime 和 ad-hoc 签名，但没有 Apple Developer 证书，未经 Apple 公证。首次启动可能需要在 Finder 中右键选择“打开”。"
